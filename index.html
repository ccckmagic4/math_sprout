<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Math Sprout V8.3</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Arial;background:linear-gradient(145deg,#07152f,#352062);color:#fff;min-height:100vh}button,input{font:inherit}.app{max-width:980px;margin:auto;padding:18px}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill,.back{border:1px solid #ffffff26;background:#ffffff18;color:#fff;padding:11px 14px;border-radius:15px}.hero{background:#ffffff12;border-radius:26px;padding:26px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.tile{border:0;border-radius:22px;padding:20px;min-height:145px;text-align:left;color:#fff;background:linear-gradient(135deg,#168ed0,#7135b3)}.mix{background:linear-gradient(135deg,#f59e0b,#e83e8c,#7141cc)}.tile b{display:block;font-size:20px;margin:12px 0}.icon{font-size:38px}.hidden{display:none!important}.play{background:#fff;color:#13203b;border-radius:28px;padding:24px;min-height:560px}.progress{height:10px;background:#e7ebf4;border-radius:20px;overflow:hidden;margin:14px 0}.progress i{display:block;background:#38d04f;height:100%}.question{text-align:center;font-size:clamp(30px,6vw,50px)}.visual{background:#f0f2ff;border-radius:22px;padding:18px;min-height:90px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:760px;margin:20px auto}.answer,.primary{border:0;border-radius:16px;padding:16px;background:#7200c8;color:#fff;font-weight:900}.feedback{padding:16px;border-radius:17px;margin:16px auto;max-width:760px}.good{background:#d8f8df;color:#145b2b}.bad{background:#fff0c7;color:#634800}.dots{display:flex;flex-direction:column;align-items:center;gap:10px}.five{display:flex;gap:12px;justify-content:center}.dot{width:45px;height:45px;border-radius:50%;background:linear-gradient(145deg,#ffe065,#ff952c);border:3px solid #fff0a1;touch-action:none;position:relative;cursor:grab}.guide{display:flex;justify-content:center;align-items:flex-start;gap:14px;flex-wrap:wrap}.set,.box{background:#fff;border:3px solid #cbd5ff;border-radius:18px;padding:12px;min-width:120px;text-align:center}.missing{border-style:dashed;color:#6b21a8}.removed{opacity:.45;text-decoration:line-through;border-color:#f59e0b}.op{font-size:30px;font-weight:900;padding-top:30px}.label,.hint{text-align:center;color:#52617a;font-weight:800;margin:8px}.smallDot{display:inline-block;width:18px;height:18px;border-radius:50%;background:#ffb52e;margin:3px}.modal{position:fixed;inset:0;background:#000c;display:grid;place-items:center;padding:16px}.modalbox{width:min(600px,100%);background:#fff;color:#13203b;border-radius:25px;padding:22px}.pin{width:100%;padding:14px;text-align:center;font-size:26px;letter-spacing:.4em;border:1px solid #bbb;border-radius:13px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tabs button{border:0;border-radius:12px;padding:10px;background:#eee8ff;color:#402478;font-weight:800}.pane{max-height:430px;overflow:auto}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#eef2ff;padding:13px;border-radius:15px;text-align:center}.historyItem{border:1px solid #dde4ef;border-radius:14px;padding:11px;margin:8px 0}.mastery{margin:12px 0}.bar{height:8px;background:#e4e9f3;border-radius:10px}.bar i{display:block;height:100%;background:#6743c3}@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}</style></head><body><div class="app"><header class="top"><h2>Math Sprout V8.3</h2><div><span class="pill" id="points">🏆 0 pts</span> <button class="pill" onclick="openParent()">🔒 Parent</button></div></header><main id="home"><div class="hero"><h1>Guided Math Missions 🚀</h1><p>See it, move it, solve it, and remember it.</p></div><div class="grid" id="tiles"></div></main><section id="play" class="hidden"><div class="row"><button class="back" onclick="showHome()">← Missions</button><b id="counter"></b></div><div class="play"><div id="tag" class="label"></div><div class="progress"><i id="prog"></i></div><h2 class="question" id="question"></h2><div class="visual" id="visual"></div><div class="answers" id="answers"></div><div id="feedback"></div></div></section></div><div id="modal" class="modal hidden"><div class="modalbox"><div class="row"><h2>Parent Access</h2><button class="primary" onclick="closeParent()">×</button></div><section id="pinPane"><input class="pin" id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off"><button class="primary" style="width:100%;margin-top:10px" onclick="unlock()">Unlock</button><p id="pinErr"></p></section><section id="dash" class="hidden"><div class="tabs"><button onclick="tab('overview')">Overview</button><button onclick="tab('mastery')">Mastery</button><button onclick="tab('history')">History</button></div><div class="pane" id="overview"></div><div class="pane hidden" id="mastery"></div><div class="pane hidden" id="history"></div></section></div></div><script>const MODULES=[{"id": "count", "name": "Count the Stars", "icon": "⭐"}, {"id": "bonds", "name": "Number Bonds", "icon": "🪐"}, {"id": "add", "name": "Rocket Addition", "icon": "🚀"}, {"id": "subtract", "name": "Moon Subtraction", "icon": "🌙"}, {"id": "missing", "name": "Missing Number", "icon": "🔭"}, {"id": "stories", "name": "Mission Stories", "icon": "🛰️"}];let state=JSON.parse(localStorage.getItem('MathSproutV83')||'{"points":0,"attempts":0,"correct":0,"sessions":0,"history":[],"modules":{},"streak":0,"best":0}');state.history=state.history||[];state.modules=state.modules||{};let session=[],idx=0,tries=0,locked=false,mode='',results=[];const $=x=>document.getElementById(x),shuffle=a=>a.slice().sort(()=>Math.random()-.5);function save(){localStorage.setItem('MathSproutV83',JSON.stringify(state));$('points').textContent='🏆 '+state.points+' pts'}function opts(ans){let s=new Set([ans]);for(let d=1;s.size<4;d++){s.add(Math.max(0,ans+d));if(s.size<4)s.add(Math.max(0,ans-d))}return shuffle([...s]).slice(0,4)}function pack(text,ans,visual,fill=false,module=''){let options=opts(ans);return{text,ans,visual,fill,module,options:options.map(String),correct:options.indexOf(ans)}}function dots(n,drag=true){let rows=[];for(let i=0;i<n;i+=5){let r='';for(let j=i;j<Math.min(n,i+5);j++)r+=`<span class="${drag?'dot':'smallDot'}"></span>`;rows.push(`<div class="five">${r}</div>`)}return rows.join('')}function model(a,total){return `<div class="guide"><div class="box"><b>${a}</b><div>${dots(a,false)}</div></div><div class="op">+</div><div class="box missing" data-missing>?</div><div class="op">=</div><div class="box"><b>${total}</b></div></div><div class="hint">Use the grouped dots to find how many more are needed.</div>`}function addModel(a,b){return `<div class="label">Build each number, then combine.</div><div class="guide"><div class="set"><b>${a}</b><div class="dots">${dots(a)}</div></div><div class="op">+</div><div class="set"><b>${b}</b><div class="dots">${dots(b)}</div></div></div>`}function subModel(a,b){return `<div class="label">Start with ${a}. Take away ${b}.</div><div class="guide"><div class="set"><b>Start ${a}</b><div class="dots">${dots(a)}</div></div><div class="op">−</div><div class="set removed"><b>Take away ${b}</b><div class="dots">${dots(b)}</div></div></div>`}function storyModel(a,b,c){return `<div class="guide"><div class="set"><b>Start ${a}</b><div class="dots">${dots(a)}</div></div><div class="set removed"><b>Use ${b}</b><div class="dots">${dots(b)}</div></div><div class="set"><b>Find ${c}</b><div class="dots">${dots(c)}</div></div></div><div class="hint">Think: start − used + found.</div>`}function bank(id){let q=[];if(id==='count')for(let n=1;n<=20;n++)for(let v=0;v<6;v++)q.push(pack('Count the grouped dots.',n,`<div class="label">Grouped in fives. Drag dots to regroup.</div><div class="dots">${dots(n)}</div>`,false,id));if(id==='bonds'||id==='missing')for(let t=2;t<=20;t++)for(let a=0;a<=t;a++)q.push(pack(`${a} + ? = ${t}`,t-a,model(a,t),true,id));if(id==='add')for(let a=0;a<=20;a++)for(let b=0;b<=20-a;b++)q.push(pack(`${a} + ${b} = ?`,a+b,addModel(a,b),true,id));if(id==='subtract')for(let a=1;a<=20;a++)for(let b=0;b<=a;b++)q.push(pack(`${a} − ${b} = ?`,a-b,subModel(a,b),true,id));if(id==='stories')for(let a=5;a<=20;a++)for(let b=1;b<a;b++){let c=(a+b)%5+1;q.push(pack(`You have ${a} oxygen tanks. Use ${b}, then find ${c}. How many now?`,a-b+c,storyModel(a,b,c),true,id))}return q}function renderTiles(){let defs=[{id:'mix',name:'Great Mix',icon:'🌈'},...MODULES];$('tiles').replaceChildren();defs.forEach(m=>{let b=document.createElement('button');b.className='tile '+(m.id==='mix'?'mix':'');b.innerHTML=`<span class="icon">${m.icon}</span><b>${m.name}</b><small>${m.id==='mix'?'Balanced 10-question session':'120+ guided variations'}</small>`;b.onclick=()=>m.id==='mix'?startMix():start(m.id);$('tiles').appendChild(b)})}function start(id){mode=id;session=shuffle(bank(id)).slice(0,10);begin()}function startMix(){mode='mix';let a=[];MODULES.forEach(m=>shuffle(bank(m.id)).slice(0,2).forEach(q=>a.push({...q,module:m.id})));session=shuffle(a).slice(0,10);begin()}function begin(){idx=0;results=[];$('home').classList.add('hidden');$('play').classList.remove('hidden');load()}function load(){locked=false;tries=0;let q=session[idx];$('counter').textContent=`Question ${idx+1} of 10`;$('prog').style.width=((idx+1)*10)+'%';$('tag').textContent=(MODULES.find(m=>m.id===q.module)||{}).name||'';$('question').textContent=q.text;$('visual').innerHTML=q.visual;$('feedback').innerHTML='';$('answers').innerHTML=q.options.map((o,i)=>`<button class="answer" onclick="answer(${i},this)">${o}</button>`).join('');dragDots()}function dragDots(){document.querySelectorAll('.dot').forEach(d=>{let sx,sy,ox=0,oy=0;d.onpointerdown=e=>{d.setPointerCapture(e.pointerId);sx=e.clientX-ox;sy=e.clientY-oy};d.onpointermove=e=>{if(!d.hasPointerCapture(e.pointerId))return;ox=e.clientX-sx;oy=e.clientY-sy;d.style.transform=`translate(${ox}px,${oy}px)`}})}function answer(i,btn){if(locked)return;tries++;state.attempts++;let q=session[idx],chosen=q.options[i];if(q.text.includes('?'))$('question').textContent=q.text.replace('?',chosen);document.querySelectorAll('[data-missing]').forEach(e=>{e.textContent=chosen;e.classList.remove('missing')});if(i===q.correct){locked=true;state.correct++;let earned=tries===1?2:1;state.points+=earned;state.streak=tries===1?state.streak+1:0;state.best=Math.max(state.best,state.streak);let m=q.module||mode;state.modules[m]=state.modules[m]||{attempts:0,correct:0,sessions:0};state.modules[m].attempts+=tries;state.modules[m].correct++;results.push({module:m,question:q.text,selected:chosen,correct:q.options[q.correct],tries,points:earned});$('feedback').innerHTML=`<div class="feedback good">🌟 Correct! +${earned} point${earned===1?'':'s'}<br><button class="primary" onclick="next()">${idx===9?'Finish':'Next question'}</button></div>`}else{btn.disabled=true;$('feedback').innerHTML='<div class="feedback bad">Good try. Use the visual and try again. The correct retry earns 1 point.</div>'}save()}function next(){if(idx<9){idx++;load();return}state.points+=10;state.sessions++;let name=mode==='mix'?'Great Mix':MODULES.find(m=>m.id===mode).name;state.history.unshift({date:new Date().toISOString(),name,score:results.length,total:10,first:results.filter(r=>r.tries===1).length,points:results.reduce((a,r)=>a+r.points,0)+10,answers:results});state.history=state.history.slice(0,50);save();$('question').textContent='🎉 Mission Complete!';$('visual').innerHTML='';$('answers').innerHTML='';$('feedback').innerHTML='<div class="feedback good">10 questions completed. +10 bonus points.<br><button class="primary" onclick="showHome()">Choose another mission</button></div>'}function showHome(){$('play').classList.add('hidden');$('home').classList.remove('hidden')}function openParent(){$('dash').classList.add('hidden');$('pinPane').classList.remove('hidden');$('modal').classList.remove('hidden');$('pin').value=''}function closeParent(){$('modal').classList.add('hidden')}function unlock(){if($('pin').value!=='2468'){$('pinErr').textContent='Incorrect PIN';return}$('pinPane').classList.add('hidden');$('dash').classList.remove('hidden');renderDash();tab('overview')}function tab(id){['overview','mastery','history'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function rank(){return state.points>=1000?'Astronaut':state.points>=500?'Commander':state.points>=250?'Engineer':state.points>=100?'Explorer':'Cadet'}function renderDash(){$('overview').innerHTML=`<h3>Overview</h3><div class="stats"><div class="stat"><b>${state.points}</b><br>Points</div><div class="stat"><b>${state.correct}</b><br>Correct</div><div class="stat"><b>${state.attempts}</b><br>Attempts</div></div><p>Rank: <b>${rank()}</b></p><p>Accuracy: <b>${state.attempts?Math.round(state.correct/state.attempts*100):0}%</b></p><p>Sessions: ${state.sessions} · Current streak: ${state.streak} · Best streak: ${state.best}</p>`;$('mastery').innerHTML='<h3>Math mastery</h3>'+MODULES.map(m=>{let x=state.modules[m.id]||{attempts:0,correct:0,sessions:0},pct=x.attempts?Math.round(x.correct/x.attempts*100):0;return `<div class="mastery"><b>${m.icon} ${m.name}</b> <span style="float:right">${pct}%</span><div class="bar"><i style="width:${pct}%"></i></div></div>`}).join('');$('history').innerHTML='<h3>History statistics</h3>'+(state.history.length?state.history.map(h=>`<div class="historyItem"><b>${h.name}</b><br><small>${new Date(h.date).toLocaleString()}</small><br>Score: ${h.score}/${h.total} · First try: ${h.first}/${h.total} · Accuracy: ${Math.round(h.score/h.total*100)}% · Points: +${h.points}<details><summary>Answer history</summary>${h.answers.map((a,i)=>`<p><b>${i+1}. ${a.module}</b><br>${a.question}<br>Answer: ${a.selected} · Correct: ${a.correct} · Tries: ${a.tries} · +${a.points} pts</p>`).join('')}</details></div>`).join(''):'<p>No completed sessions yet.</p>')}renderTiles();save();</script></body></html>
